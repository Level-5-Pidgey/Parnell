name: Release Retainer Repricer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud-latest.zip
          Expand-Archive -Force dalamud-latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build plugin
        run: dotnet build RetainerRepricer/RetainerRepricer.csproj --configuration Release --arch x64

      - name: Package plugin
        shell: pwsh
        run: Compress-Archive -Path RetainerRepricer/bin/x64/Release/* -DestinationPath latest.zip

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: latest.zip
